# ============================================================================
#  Cấu hình Mosquitto mẫu cho đồ án (Mosquitto 2.x)
#  Chạy:  mosquitto -c mosquitto.conf -v
#  Tạo file mật khẩu (lần đầu dùng -c để tạo mới):
#     mosquitto_passwd -c passwd admin
#     mosquitto_passwd passwd backend
#     mosquitto_passwd passwd tele-a1b2c3
#  (đổi tên thiết bị theo Device ID thực tế in ra Serial)
# ============================================================================
listener 1883 0.0.0.0
allow_anonymous false
password_file passwd
acl_file acl

# Giữ trạng thái retained (status, config) qua các lần khởi động lại broker
persistence true
persistence_location ./data/
# (tạo sẵn thư mục "data" cạnh file này; Windows: chạy CMD tại thư mục tools rồi
#  "C:\Program Files\mosquitto\mosquitto.exe" -c mosquitto.conf -v, và mở cổng 1883 trên Firewall)

# Giữ giới hạn kích thước bản tin mặc định (không giới hạn)
# message_size_limit 0

log_type error
log_type warning
log_type notice
log_type information
