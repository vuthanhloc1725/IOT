name: iot-smart-agriculture

x-backend-environment: &backend-environment
  NODE_ENV: production
  PORT: 3000
  CORS_ORIGIN: ${CORS_ORIGIN:-*}
  DB_HOST: mysql
  DB_PORT: 3306
  DB_NAME: iot
  DB_USER: ${MYSQL_USER:-iot_app}
  DB_PASSWORD: ${MYSQL_PASSWORD:?Set MYSQL_PASSWORD in deployment/.env}
  DB_SYNC: none
  JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in deployment/.env}
  JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-8h}
  MQTT_ENABLED: "true"
  MQTT_URL: mqtt://mosquitto:1883
  MQTT_DEVICE_URL: ${MQTT_DEVICE_URL:?Set MQTT_DEVICE_URL to the host LAN IP, e.g. mqtt://192.168.1.100:1883}
  MQTT_CA_FILE: ""
  MQTT_USERNAME: ${MQTT_BACKEND_USERNAME:-agri_backend}
  MQTT_PASSWORD: ${MQTT_BACKEND_PASSWORD:?Set MQTT_BACKEND_PASSWORD in deployment/.env}
  MQTT_TOPIC_PREFIX: iot
  MQTT_FIRMWARE_TOPIC_PREFIX: sf
  MQTT_DYNSEC_ENABLED: "true"
  MQTT_DYNSEC_ADMIN_USERNAME: ${MQTT_DYNSEC_ADMIN_USERNAME:-iot_dynsec_admin}
  MQTT_DYNSEC_ADMIN_PASSWORD: ${MQTT_DYNSEC_ADMIN_PASSWORD:?Set MQTT_DYNSEC_ADMIN_PASSWORD in deployment/.env}
  MQTT_DYNSEC_REQUEST_TIMEOUT_MS: ${MQTT_DYNSEC_REQUEST_TIMEOUT_MS:-8000}
  CLAIM_REQUIRE_TLS: ${CLAIM_REQUIRE_TLS:-false}
  CLAIM_TRUSTED_PROXY_IPS: ${CLAIM_TRUSTED_PROXY_IPS:-}
  HEARTBEAT_SWEEP_SEC: ${HEARTBEAT_SWEEP_SEC:-10}
  COMMAND_ACK_TIMEOUT_SEC: ${COMMAND_ACK_TIMEOUT_SEC:-15}
  DEVICE_PROBE_TIMEOUT_SEC: ${DEVICE_PROBE_TIMEOUT_SEC:-8}
  CAMERA_IMAGE_MAX_BYTES: ${CAMERA_IMAGE_MAX_BYTES:-10485760}
  CAMERA_IMAGE_STORAGE_DIR: storage/camera-media
  AI_IMAGE_MAX_BYTES: ${AI_IMAGE_MAX_BYTES:-5242880}
  AI_IMAGE_STORAGE_DIR: storage/analysis-images
  AI_API_URL: ${AI_API_URL:-}
  AI_API_KEY: ${AI_API_KEY:-}
  AI_REQUEST_TIMEOUT_MS: ${AI_REQUEST_TIMEOUT_MS:-60000}
  CLOUDINARY_CLOUD_NAME: ${CLOUDINARY_CLOUD_NAME:-}
  CLOUDINARY_API_KEY: ${CLOUDINARY_API_KEY:-}
  CLOUDINARY_API_SECRET: ${CLOUDINARY_API_SECRET:-}
  CLOUDINARY_FOLDER: ${CLOUDINARY_FOLDER:-smart-agri/camera-media}

services:
  mysql:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in deployment/.env}
      MYSQL_DATABASE: iot
      MYSQL_USER: ${MYSQL_USER:-iot_app}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Set MYSQL_PASSWORD in deployment/.env}
      TZ: Asia/Bangkok
    command:
      - --default-time-zone=+07:00
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    ports:
      - "127.0.0.1:${MYSQL_HOST_PORT:-3307}:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ../database/01_create_tables.sql:/docker-entrypoint-initdb.d/01_create_tables.sql:ro
      - ../database/02_seed_data.sql:/docker-entrypoint-initdb.d/02_seed_data.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$${MYSQL_ROOT_PASSWORD}\" --silent"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    networks: [iot]

  mosquitto-dynsec-init:
    image: eclipse-mosquitto:2.1.2-alpine
    user: "0:0"
    restart: "no"
    entrypoint: ["/bin/sh", "/init-mosquitto-dynsec.sh"]
    environment:
      MQTT_DYNSEC_ADMIN_USERNAME: ${MQTT_DYNSEC_ADMIN_USERNAME:-iot_dynsec_admin}
      MQTT_DYNSEC_ADMIN_PASSWORD: ${MQTT_DYNSEC_ADMIN_PASSWORD:?Set MQTT_DYNSEC_ADMIN_PASSWORD in deployment/.env}
    volumes:
      - mosquitto-data:/mosquitto/data
      - ./scripts/init-mosquitto-dynsec.sh:/init-mosquitto-dynsec.sh:ro
    networks: [iot]

  mosquitto:
    image: eclipse-mosquitto:2.1.2-alpine
    restart: unless-stopped
    depends_on:
      mosquitto-dynsec-init:
        condition: service_completed_successfully
    ports:
      - "${MQTT_HOST_BIND:-0.0.0.0}:${MQTT_HOST_PORT:-1883}:1883"
    volumes:
      - ./mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - mosquitto-data:/mosquitto/data
    environment:
      MQTT_DYNSEC_ADMIN_USERNAME: ${MQTT_DYNSEC_ADMIN_USERNAME:-iot_dynsec_admin}
      MQTT_DYNSEC_ADMIN_PASSWORD: ${MQTT_DYNSEC_ADMIN_PASSWORD:?Set MQTT_DYNSEC_ADMIN_PASSWORD in deployment/.env}
    healthcheck:
      test: ["CMD-SHELL", "mosquitto_sub -h 127.0.0.1 -p 1883 -u \"$${MQTT_DYNSEC_ADMIN_USERNAME}\" -P \"$${MQTT_DYNSEC_ADMIN_PASSWORD}\" -t '$$SYS/broker/version' -C 1 -W 3 >/dev/null 2>&1"]
      interval: 15s
      timeout: 7s
      retries: 8
      start_period: 15s
    networks: [iot]

  mqtt-bootstrap:
    image: iot-smart-agriculture-backend:local
    build:
      context: ..
      dockerfile: deployment/Dockerfile.backend
    restart: "no"
    depends_on:
      mosquitto:
        condition: service_healthy
    environment: *backend-environment
    command: ["node", "scripts/ensure-backend-mqtt-account.js"]
    networks: [iot]

  backend:
    image: iot-smart-agriculture-backend:local
    build:
      context: ..
      dockerfile: deployment/Dockerfile.backend
    restart: unless-stopped
    init: true
    stop_grace_period: 15s
    depends_on:
      mysql:
        condition: service_healthy
      mqtt-bootstrap:
        condition: service_completed_successfully
    environment: *backend-environment
    volumes:
      - backend-storage:/app/storage
    expose:
      - "3000"
    networks: [iot]

  frontend:
    build:
      context: ..
      dockerfile: deployment/Dockerfile.frontend
      args:
        VITE_API_URL: /api
        VITE_SOCKET_URL: ""
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${HTTP_PORT:-8080}:80"
    networks: [iot]

volumes:
  mysql-data:
  mosquitto-data:
  backend-storage:

networks:
  iot:
    driver: bridge
