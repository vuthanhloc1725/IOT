map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

upstream iot_backend {
    server backend:3000;
    keepalive 32;
}

server {
    listen 80;
    server_name _;
    server_tokens off;

    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 12m;

    # Backend liveness endpoint, exposed through the same-origin frontend host.
    location = /health {
        proxy_pass http://iot_backend/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # REST API. Keep the original /api prefix because Express mounts routes at /api.
    location /api/ {
        proxy_pass http://iot_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_send_timeout 70s;
        proxy_read_timeout 70s;
    }

    # Socket.IO polling + WebSocket upgrade.
    location /socket.io/ {
        proxy_pass http://iot_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # React Router fallback.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
